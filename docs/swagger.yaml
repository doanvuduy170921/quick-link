definitions:
  http.LoginRequest:
    properties:
      email:
        example: doanvuduyndh@gmail.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  http.LoginResponse:
    properties:
      access_token:
        type: string
    type: object
  http.RegisterRequest:
    properties:
      email:
        example: doanvuduyndh@gmail.com
        type: string
      password:
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  http.ShortenInput:
    properties:
      custom_alias:
        example: test
        type: string
      url:
        example: http://google.com
        type: string
    required:
    - url
    type: object
  http.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
info:
  contact:
    name: Doan Vu Duy
    url: https://github.com/doanvuduy170921
  description: URL Shortener service with JWT auth, click analytics (goroutine/channel
    worker pool), Redis caching and rate limiting.
  termsOfService: http://swagger.io/terms/
  title: Quick-Link API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login and get JWT access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/http.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: email already registered
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /redirect/{code}:
    get:
      description: Redirects to the original URL for a given short code. Tracks click
        asynchronously.
      parameters:
      - description: Short code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirects to original URL
        "404":
          description: code not found or expired
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Redirect to original URL
      tags:
      - url
  /shorten:
    post:
      consumes:
      - application/json
      description: |-
        Shortens a long URL. Anonymous users get a random code (user_id = null).
        Authenticated users may pass a custom_alias; anonymous users passing custom_alias get 401.
      parameters:
      - description: URL to shorten
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.ShortenInput'
      produces:
      - application/json
      responses:
        "200":
          description: code, message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: validation error / malformed body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: custom_alias requires login
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a short URL
      tags:
      - url
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
